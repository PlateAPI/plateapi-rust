[package]
name = "plateapi"
version = "0.1.0"
edition = "2021"
authors = ["WolfStack Solutions"]
description = "Rust SDK for PlateAPI -- Australian vehicle registration plate lookup"
license = "MIT"
repository = "https://github.com/PlateAPI/plateapi-rust"
readme = "README.md"
keywords = ["plateapi", "vehicle", "registration", "australia", "api"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "lookup"
path = "examples/lookup.rs"
